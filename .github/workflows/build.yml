name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version Name (e.g., 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Generate Gradle Wrapper
      run: gradle wrapper --gradle-version 8.12.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Restore Keystore and Properties
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo $KEYSTORE_BASE64 | base64 --decode > release-key.jks
        
        echo "storeFile=release-key.jks" >> key.properties
        echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
        echo "keyPassword=$KEY_PASSWORD" >> key.properties
        echo "keyAlias=localai-new-alias" >> key.properties

    - name: Parse Version Code and Write version.properties
      run: |
        VERSION_NAME="${{ github.event.inputs.version }}"
        VERSION_CODE=$(echo "$VERSION_NAME" | tr -d '.')
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
        
        echo "VERSION_CODE=$VERSION_CODE" > version.properties
        echo "VERSION_NAME=$VERSION_NAME" >> version.properties

    - name: Build Release APK
      run: ./gradlew assembleRelease -PversionCode=${{ env.VERSION_CODE }} -PversionName=${{ github.event.inputs.version }}

    - name: Generate update.json
      run: |
        VERSION="${{ github.event.inputs.version }}"
        TAG="v$VERSION"
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"

        cat << EOF > update.json
        {
          "versionCode": ${{ env.VERSION_CODE }},
          "versionName": "$VERSION",
          "downloadUrl": "https://github.com/$REPO_OWNER/$REPO_NAME/releases/download/$TAG/app-release.apk",
          "releaseNotes": "Automated update release for version $VERSION"
        }
        EOF

    - name: Commit and Push update.json and version.properties
      run: |
        VERSION="${{ github.event.inputs.version }}"
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add update.json version.properties
        git commit -m "Auto-update update.json and version for version $VERSION" || echo "No changes to commit"
        git push origin main

    - name: Create GitHub Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
          update.json
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
