name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.12.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Restore Keystore and Properties
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo $KEYSTORE_BASE64 | base64 --decode > release-key.jks
        
        echo "storeFile=release-key.jks" >> key.properties
        echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
        echo "keyPassword=$KEY_PASSWORD" >> key.properties
        echo "keyAlias=localai-new-alias" >> key.properties

    - name: Build Signed Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Extract Version Info
      id: vars
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION_TAG=${GITHUB_REF#refs/tags/v}
        else
          VERSION_TAG="1.0.$(date +%s)"
        fi
        echo "version_name=$VERSION_TAG" >> $GITHUB_OUTPUT
        VERSION_CODE=$(date +%s)
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Generate update.json Metadata
      run: |
        cat <<EOF > update.json
        {
          "versionCode": ${{ steps.vars.outputs.version_code }},
          "versionName": "${{ steps.vars.outputs.version_name }}",
          "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.vars.outputs.version_name }}/app-release.apk",
          "releaseNotes": "Automated update release for version ${{ steps.vars.outputs.version_name }}"
        }
        EOF

    - name: Commit and Push update.json to Main
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add update.json
        git commit -m "Auto-update update.json for version ${{ steps.vars.outputs.version_name }}"
        git push origin HEAD:main

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk

    - name: Create GitHub Release and Upload Asset
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        name: Release v${{ steps.vars.outputs.version_name }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
