name: Build Android APK

on:
  push:
    branches: [ "ui-rewrite" ]
  pull_request:
    branches: [ "ui-rewrite" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4

    - name: Generate Gradle Wrapper
      run: |
        # Generates gradlew dynamically
        gradle wrapper --gradle-version 8.12.1

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # --- INJECTS SECURE KEYSTORE FROM GITHUB SECRETS ---
    - name: Restore Keystore and Properties
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo $KEYSTORE_BASE64 | base64 --decode > release-key.jks
        
        echo "storeFile=release-key.jks" >> key.properties
        echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
        echo "keyPassword=$KEY_PASSWORD" >> key.properties
        echo "keyAlias=localai-new-alias" >> key.properties

    - name: Build Signed Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release.apk
